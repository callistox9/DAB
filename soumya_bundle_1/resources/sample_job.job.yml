# A sample job for soumya_bundle_1.

resources:
  jobs:
    soumya_bundle_1:
      name: soumya_bundle_1

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/customer_360.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      # git_source:
      #   git_branch: dev
      #   git_provider: gitHub
      #   git_url: https://github.com/callistox9/DAB.git
